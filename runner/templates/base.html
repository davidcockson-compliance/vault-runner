<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Obsidian LLM Runner{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --accent:   #58a6ff;
      --red:      #f85149;
      --green:    #3fb950;
      --yellow:   #d29922;
      --muted:    #8b949e;
      --text:     #e6edf3;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, 'SF Mono', 'Fira Code', monospace;
      font-size: 14px;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { color: var(--accent); font-size: 1rem; font-weight: 600; letter-spacing: 0.04em; }
    header .host { color: var(--muted); font-size: 0.75rem; }

    main { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .full { grid-column: 1 / -1; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
    }
    .card h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    /* ── Form ── */
    .form-row { margin-bottom: 0.875rem; }
    .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.3rem; }
    input[type="text"], input[type="file"], select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.65rem;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }
    textarea { min-height: 110px; resize: vertical; }
    select { cursor: pointer; }

    .btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 0.5rem 1.25rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-sm { padding: 0.3rem 0.75rem; font-size: 0.75rem; }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 0.1rem 0.45rem;
      border-radius: 10px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-right: 0.4rem;
    }
    .badge-queue    { background: #1c2d4a; color: var(--accent); }
    .badge-active   { background: #2d2007; color: var(--yellow); }
    .badge-done     { background: #0d2818; color: var(--green); }
    .badge-fail     { background: #2d0d0d; color: var(--red); }

    /* ── Lists ── */
    .item-list { list-style: none; }
    .item-list li {
      padding: 0.35rem 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
    }
    .item-list li:last-child { border-bottom: none; }
    .item-list a { color: var(--accent); text-decoration: none; }
    .item-list a:hover { text-decoration: underline; }

    /* ── Notifications ── */
    .notif { padding: 0.6rem 0.85rem; border-radius: 4px; margin-top: 0.75rem; font-size: 0.8rem; }
    .notif-ok  { background: #0d2818; border: 1px solid var(--green); color: var(--green); }
    .notif-err { background: #2d0d0d; border: 1px solid var(--red);   color: var(--red); }
    .notif code { background: rgba(255,255,255,0.08); padding: 0 0.3rem; border-radius: 3px; }

    /* ── Log pre ── */
    .log-pre {
      font-size: 0.72rem;
      line-height: 1.55;
      color: #7ee787;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.75rem;
      max-height: 320px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty { color: var(--muted); font-size: 0.8rem; text-align: center; padding: 1.5rem 0; }

    #image-row { display: none; }

    .back-link { color: var(--accent); text-decoration: none; font-size: 0.8rem; }
    .back-link:hover { text-decoration: underline; }
    .output-pre {
      font-size: 0.8rem;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>⬡ Obsidian LLM Runner</h1>
    <span class="host">{{ public_host or "localhost:8000" }}</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Toggle image field when job type is set to vision
    document.addEventListener('change', function(e) {
      if (e.target.id === 'job_type') {
        document.getElementById('image-row').style.display =
          e.target.value === 'vision' ? 'block' : 'none';
      }
    });
  </script>
</body>
</html>
